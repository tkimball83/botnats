[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botnats"
version = "0.2.6"
description = "Python IRC bot mesh coordinated through Core NATS and JetStream"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
  "nats-py==2.15.0",
]

[project.optional-dependencies]
dev = [
  "isort==8.0.1",
  "mypy==2.3.0",
  "ruff==0.16.1",
]

[project.scripts]
botnats = "botnats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
known_first_party = ["botnats"]

[tool.mypy]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["COM812", "D107", "PLR2004", "PT027"]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
]
