---
repos:
  # The Python tools run from the project venv (make install), so
  # pyproject.toml pins each of them once.
  - repo: local
    hooks:
      - id: blank-line-after-blocks
        name: blank-line-after-blocks
        entry: venv/bin/blank-line-after-blocks
        language: system
        files: ^(src|tests)/.*\.py$
        verbose: true
      - id: ruff-check
        name: ruff check
        entry: venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: venv/bin/ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: venv/bin/mypy src tests
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        entry: yamllint --strict
...
