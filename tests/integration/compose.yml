---
x-bot: &bot
  depends_on:
    irc:
      condition: service_healthy
    nats-1:
      condition: service_healthy
    nats-2:
      condition: service_healthy
    nats-3:
      condition: service_healthy
  # tests/integration/run.py owns these values and exports them for compose.
  environment:
    BOTNATS_COORDINATION_SECRET: ${BOTNATS_TEST_COORDINATION_SECRET:?run via tests/integration/run.py}
    BOTNATS_LOG_LEVEL: DEBUG
    BOTNATS_NATS_TOKEN: ${BOTNATS_TEST_NATS_TOKEN:?run via tests/integration/run.py}
    BOTNATS_TOTP_SECRET: ${BOTNATS_TEST_TOTP_SECRET:?run via tests/integration/run.py}
  healthcheck:
    interval: 2s
    retries: 60
    test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/ready | grep -qx ok
    timeout: 1s
  image: botnats-test:integration

x-nats: &nats
  healthcheck:
    interval: 5s
    retries: 30
    test:
      - CMD-SHELL
      - >-
        wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'
        | grep -q '"status":"ok"'
    timeout: 1s
  image: nats:2.15.2-alpine
  volumes:
    - /data

services:
  alpha:
    <<: *bot
    build:
      context: ../..
    volumes:
      - ./config/alpha.json:/etc/botnats/bot.json:ro

  beta:
    <<: *bot
    volumes:
      - ./config/beta.json:/etc/botnats/bot.json:ro

  gamma:
    <<: *bot
    volumes:
      - ./config/gamma.json:/etc/botnats/bot.json:ro

  irc:
    healthcheck:
      interval: 5s
      retries: 30
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 6667
      timeout: 1s
    image: ghcr.io/ergochat/ergo:v2.19.1
    ports:
      - 127.0.0.1::6667

  nats-1:
    <<: *nats
    command:
      - --auth
      - ${BOTNATS_TEST_NATS_TOKEN:?run via tests/integration/run.py}
      - --cluster
      - nats://0.0.0.0:6222
      - --cluster_name
      - botnats-test
      - --http_port
      - "8222"
      - --jetstream
      - --routes
      - nats://nats-2:6222,nats://nats-3:6222
      - --server_name
      - nats-1
      - --store_dir
      - /data
    ports:
      - 127.0.0.1::4222

  nats-2:
    <<: *nats
    command:
      - --auth
      - ${BOTNATS_TEST_NATS_TOKEN:?run via tests/integration/run.py}
      - --cluster
      - nats://0.0.0.0:6222
      - --cluster_name
      - botnats-test
      - --http_port
      - "8222"
      - --jetstream
      - --routes
      - nats://nats-1:6222,nats://nats-3:6222
      - --server_name
      - nats-2
      - --store_dir
      - /data
    ports:
      - 127.0.0.1::4222

  nats-3:
    <<: *nats
    command:
      - --auth
      - ${BOTNATS_TEST_NATS_TOKEN:?run via tests/integration/run.py}
      - --cluster
      - nats://0.0.0.0:6222
      - --cluster_name
      - botnats-test
      - --http_port
      - "8222"
      - --jetstream
      - --routes
      - nats://nats-1:6222,nats://nats-2:6222
      - --server_name
      - nats-3
      - --store_dir
      - /data
    ports:
      - 127.0.0.1::4222
